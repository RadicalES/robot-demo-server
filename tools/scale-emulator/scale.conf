# The scale emulator's settings, so starting it is one command.
#
# Edit this, then run ./scale.sh - or `npm run scale` from the repository root.
# Anything you pass on the command line wins over what is here.

# Which serial port the emulator writes into. This must be cabled to the port
# the terminal reads its scale on - or be the terminal's own scale port with a
# loopback plug in it. Leave empty and the emulator makes a pty and prints its
# name, which needs no hardware at all (Linux and macOS only).
#
# Linux    /dev/ttyUSB0     the first USB serial adapter
# Windows  COM3             Device Manager > Ports (COM & LPT) says which
#
# Uncomment the one this machine is:
PORT=/dev/ttyUSB0
#PORT=COM3

# The indicator to imitate. wsScale decodes MICRO-A12E, RICHTER, XK3118T1,
# MASSAMATIC and RINSTRUM; the terminal must be set to the same one on its
# Communications page or it will not decode a thing.
PROTOCOL=MICRO-A12E

# What the scale reads.
#
# RAMP walks the weight up and down on its own - LOW:HIGH:STEP - which is the
# one to use in front of an audience: the screen moves without anybody touching
# anything, and the app's unstable/stable handling is visible. It wins over
# WEIGHT when both are set; clear it to hold a fixed weight instead.
#
# Either way, typing a number and pressing enter while it runs sets the weight.
RAMP=0:25:0.5
WEIGHT=0

# Gross or nett, and the units in the frame.
KIND=N
UNITS=kg
