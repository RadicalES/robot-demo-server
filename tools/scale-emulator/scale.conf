# The scale emulator's settings, so starting it is one command.
#
# Edit this, then run ./scale.sh - or `npm run scale` from the repository root.
# Anything you pass on the command line wins over what is here.

# Which serial port the emulator writes into. This must be cabled to the port
# the terminal reads its scale on - or be the terminal's own scale port with a
# loopback plug in it. Leave empty and the emulator makes a pty and prints its
# name, which needs no hardware at all.
PORT=/dev/ttyUSB0

# The indicator to imitate. wsScale decodes MICRO-A12E, RICHTER, XK3118T1,
# MASSAMATIC and RINSTRUM; the terminal must be set to the same one on its
# Communications page or it will not decode a thing.
PROTOCOL=MICRO-A12E

# What it reads at startup. With RAMP set the weight climbs on its own, which
# is the one to use in front of an audience: LOW:HIGH:STEP.
# Either way, typing a number and pressing enter sets the weight.
WEIGHT=0
RAMP=

# Gross or nett, and the units in the frame.
KIND=N
UNITS=kg
